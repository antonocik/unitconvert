<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UnitConvert — Konversi Satuan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f87171'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="app-head">
      <div class="brand">
        <div class="brand__mark">UC</div>
        <h1>UnitConvert</h1>
      </div>
    </header>

    <div class="converter">
      <select id="type">
        <option value="length">Panjang</option>
        <option value="weight">Berat</option>
        <option value="temp">Suhu</option>
        <option value="currency">Mata Uang</option>
        <option value="digital">Data Digital</option>
      </select>

      <div class="form-row">
        <div class="selector" id="fromUnit"></div>
        <span style="margin:0 12px;font-size:.9rem;color:var(--muted)">→</span>
        <div class="selector" id="toUnit"></div>
      </div>

      <div class="form-row">
        <input type="number" id="fromValue" placeholder="1" min="0" step="any">
        <button class="btn--convert" id="convertBtn">Konvert</button>
      </div>

      <div class="result" id="result">
        <span class="result__value" id="to">0</span>
        <span class="result__unit" id="unit"></span>
      </div>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Satuan</th>
          <th>Sama dengan 1 satuan pertama</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
